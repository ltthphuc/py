<html lang="vi"><head><meta charset="utf-8"><title>Kiểm thử lớp FirebaseDB bằng SDK giả lập</title></head>
<body><pre id="log">đang chạy…</pre>
<!-- Trang này nạp lớp FirebaseDB THẬT của dự án nhưng thay SDK Firebase bằng bản giả lập (dựng trên LocalDB),
     để kiểm tra các lời gọi API (ref, set, update, push, on, off, onDisconnect, auth…) và toàn bộ logic Hub. -->
<script>window.PYLAB_CONFIG = { backend: 'firebase', firebase: { apiKey: 'test', databaseURL: 'https://test.firebaseio.com' }, maxFileKB: 700 };</script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/db-local.js"></script>
<script>
  /* ----- SDK Firebase giả lập ----- */
  (function () {
    localStorage.removeItem('pylab_mock_db'); const L = new LocalDB({ key: 'pylab_mock_db', channel: 'pylab-mock-db' });
    const snap = (v, k) => ({ val: () => (v === undefined ? null : v), key: k });
    function ref(path) {
      const key = path.split('/').pop();
      const r = {
        key,
        get: async () => snap(await L.get(path), key),
        set: (v) => { if (v === undefined) throw new Error('set(undefined)'); return L.set(path, v); },
        update: (o) => { for (const k in o) if (o[k] === undefined) throw new Error('update: undefined tại ' + k); return L.update(path, o); },
        remove: () => L.remove(path),
        push() { const k = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); const c = ref(path + '/' + k); return c; },
        on(ev, cb) {
          if (path === '.info/connected') { setTimeout(() => cb(snap(true, 'connected')), 0); return cb; }
          const off = L.on(path, ev, (v, k) => cb(snap(v, k)));
          (ref._h = ref._h || []).push({ ev, cb, off }); window.__handlers = (window.__handlers || 0) + 1; return cb;
        },
        off(ev, h) { /* hủy đăng ký */ window.__handlers = (window.__handlers || 1) - 1; },
        onDisconnect: () => ({ set: (v) => L.onDisconnectSet(path, v) }),
      };
      return r;
    }
    const mkAuth = () => { let user = null; return {
      onAuthStateChanged(cb) { setTimeout(() => cb(user), 0); return () => {}; },
      signInAnonymously: async () => { user = { uid: 'S' + Math.random().toString(36).slice(2, 7), isAnonymous: true }; return { user }; },
      signInWithEmailAndPassword: async (e, p) => { if (p !== 'ok') { const x = new Error('wrong'); x.code = 'auth/wrong-password'; throw x; } user = { uid: 'TEACHER1', isAnonymous: false }; return { user }; },
      signOut: async () => { user = null; },
      get currentUser() { return user; },
    }; };
    const accounts = { 'cu@truong.vn': { pw: 'matcu1', uid: 'OLDUID' } };
    const secAuth = { _u: null,
      async createUserWithEmailAndPassword(e, p) { if (accounts[e]) { const x = new Error('exists'); x.code = 'auth/email-already-in-use'; throw x; } accounts[e] = { pw: p, uid: 'NEW' + Object.keys(accounts).length }; this._u = { uid: accounts[e].uid }; return { user: this._u }; },
      async signInWithEmailAndPassword(e, p) { if (!accounts[e] || accounts[e].pw !== p) { const x = new Error('wrong'); x.code = 'auth/wrong-password'; throw x; } this._u = { uid: accounts[e].uid }; return { user: this._u }; },
      async signOut() { this._u = null; window.__secSignOut = (window.__secSignOut || 0) + 1; } };
    window.firebase = {
      apps: [], __named: {},
      initializeApp(c, name) { this.apps.push(c); if (name) { this.__named[name] = { options: c, auth: () => secAuth }; return this.__named[name]; } },
      app(name) { if (!name) return { options: this.apps[0] || {}, auth: () => window.firebase.auth() }; if (!this.__named[name]) throw new Error('no app ' + name); return this.__named[name]; },
      auth: () => window.firebase.__auth || (window.firebase.__auth = mkAuth()),
      database: Object.assign(() => ({ ref }), { ServerValue: { TIMESTAMP: 1700000000000 } }),
    };
  })();
</script>
<script src="../assets/js/db-firebase.js"></script>
<script src="../assets/js/hub.js"></script>
<script>
(async () => {
  const checks = [];
  const ok = (n, c, x) => checks.push([n, !!c, c ? '' : String(x)]);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function until(f, t = 3000) { const t0 = Date.now(); while (Date.now() - t0 < t) { if (f()) return true; await wait(30); } return false; }
  try {
    const dbT = Hub.createDB(), dbS = Hub.createDB();
    ok('createDB trả về FirebaseDB', dbT.kind === 'firebase');
    // mỗi "người dùng" có một đối tượng auth riêng
    const tAuth = { _u: null, onAuthStateChanged(cb) { setTimeout(() => cb(this._u), 0); return () => {}; }, signInWithEmailAndPassword: async function (e, p) { if (p !== 'ok') { const x = new Error('wrong'); x.code = 'auth/wrong-password'; throw x; } this._u = { uid: 'TEACHER1', isAnonymous: false }; return { user: this._u }; }, signOut: async function () { this._u = null; }, get currentUser() { return this._u; } };
    const sAuth = { _u: null, onAuthStateChanged(cb) { setTimeout(() => cb(this._u), 0); return () => {}; }, signInAnonymously: async function () { this._u = { uid: 'STU' + Math.random().toString(36).slice(2, 6), isAnonymous: true }; return { user: this._u }; }, get currentUser() { return this._u; } };
    dbT.auth = tAuth; dbS.auth = sAuth;

    let bad = null; try { await dbT.signInTeacher('a@b.c', 'sai'); } catch (e) { bad = e; }
    ok('Đăng nhập sai mật khẩu bị từ chối', bad && /wrong/.test(bad.code));
    ok('Đăng nhập giáo viên đúng', (await dbT.signInTeacher('a@b.c', 'ok')) === 'TEACHER1');
    ok('restoreTeacher thấy tài khoản giáo viên', (await dbT.restoreTeacher()) === 'TEACHER1');

    /* giáo viên tạo lớp, lắng nghe */
    const T = new Hub.TeacherConn(dbT, 'lop1');
    let errOpen = null; try { await new Hub.TeacherConn(dbT, 'chuaco').open({}); } catch (e) { errOpen = e; }
    ok('Mở lớp chưa tồn tại báo lỗi gợi ý Tạo lớp', errOpen && /Tạo lớp/.test(errOpen.message));
    const meta = await T.open({ create: true, title: 'Lớp 9A1' });
    ok('Tạo lớp ghi meta (title, owner)', meta.title === 'Lớp 9A1' && meta.owner === 'TEACHER1', JSON.stringify(meta));
    const seen = {}; T.onStudents((id, s) => { if (s) seen[id] = s; else delete seen[id]; });
    let subs = []; T.onSubs((l) => { subs = l; });
    let tfiles = []; T.onFiles((l) => { tfiles = l; });

    /* học sinh vào lớp */
    const S = new Hub.StudentConn(dbS, 'lop1');
    let err2 = null; try { await new Hub.StudentConn(dbS, 'sai-ma').join({ name: 'x' }); } catch (e) { err2 = e; }
    ok('Học sinh vào mã lớp sai bị báo lỗi', err2 && /chưa tồn tại/.test(err2.message));
    await S.join({ may: '05', name: 'Nguyễn Văn An', lop: '9A1', bai: '3', code: 'print(1)', segs: '[]', status: 'idle', errLine: 0, waiting: false });
    ok('Giáo viên thấy học sinh vào lớp (online)', await until(() => seen[S.uid] && seen[S.uid].online === true), JSON.stringify(seen));
    ok('Thông tin học sinh đúng', seen[S.uid] && seen[S.uid].name === 'Nguyễn Văn An' && seen[S.uid].may === '05' && seen[S.uid].code === 'print(1)');

    /* trạng thái trực tiếp */
    await S.setState({ code: 'print(2)', segs: JSON.stringify([{ k: 'o', s: '2\n' }]), status: 'done' });
    ok('Cập nhật code, kết quả, trạng thái tới giáo viên', await until(() => seen[S.uid].code === 'print(2)' && seen[S.uid].segs[0].s === '2\n' && seen[S.uid].status === 'done'), JSON.stringify(seen[S.uid]));
    ok('Giáo viên đánh dấu "đang gõ" khi code đổi', seen[S.uid].last_code > 0);

    /* lệnh giáo viên → học sinh */
    const got = []; S.onCmd((c) => got.push(c));
    await T.cmd(S.uid, { t: 'run', code: 'print(9)' }); await T.cmd(S.uid, { t: 'stop' }); await T.cmd(S.uid, { t: 'input', text: 'abc' }); await T.notifyMany([S.uid], 'Chú ý');
    ok('Học sinh nhận đủ 4 lệnh run/stop/input/notify', await until(() => got.length === 4), JSON.stringify(got));
    ok('Lệnh run mang theo code', got[0] && got[0].t === 'run' && got[0].code === 'print(9)');
    await wait(100);
    ok('Lệnh đã xử lý bị xóa khỏi hàng đợi', (await dbT.get('rooms/lop1/cmd/' + S.uid)) === null);

    /* khóa + sửa code */
    let ctl = {}; S.onCtl((c) => { ctl = c; });
    await T.setLock(S.uid, true); await T.setEdit(S.uid, 'print("thầy sửa")');
    ok('Học sinh nhận khóa và code do giáo viên sửa', await until(() => ctl.locked === true && ctl.edit && ctl.edit.code === 'print("thầy sửa")'), JSON.stringify(ctl));
    ok('Giáo viên thấy trạng thái khóa', await until(() => seen[S.uid].locked === true));
    await T.setLock(S.uid, false);
    ok('Mở khóa xóa luôn ctl', await until(() => !ctl.locked && !ctl.edit), JSON.stringify(ctl));

    /* nộp bài (2 lần) */
    const r1 = await S.submit({ may: '05', name: 'Nguyễn Văn An', lop: '9A1', bai: '3', code: 'print("lần 1")' });
    await wait(10);
    const r2 = await S.submit({ may: '05', name: 'Nguyễn Văn An', lop: '9A1', bai: '3', code: 'print("lần 2")' });
    ok('Tên file nộp đúng mẫu', r1.file === '05_Nguyễn_Văn_An_Bai3.py', r1.file);
    ok('Giáo viên nhận 2 bản nộp', await until(() => subs.length === 2), JSON.stringify(subs));
    ok('Bản mới nhất xếp đầu', subs[0] && subs[0].code.includes('lần 2') || subs[0].ts >= subs[1].ts);
    ok('Hồ sơ học sinh ghi nhận đã nộp', await until(() => seen[S.uid].submit_file === r1.file && seen[S.uid].submitted_at > 0));
    await T.deleteSub(S.uid, subs[1].key);
    ok('Giáo viên xóa được một bản nộp', await until(() => subs.length === 1));

    /* chia sẻ file */
    let sfiles = []; S.onFiles((l) => { sfiles = l; });
    const id = await T.addFile(new File(['print("de")'], 'De bai.py'));
    ok('Giáo viên thấy file đã chia sẻ', await until(() => tfiles.length === 1 && tfiles[0].name === 'De bai.py'));
    ok('Học sinh thấy danh sách file', await until(() => sfiles.length === 1 && sfiles[0].name === 'De bai.py'));
    ok('Học sinh tải được nội dung file', (await (await S.fileBlob({ id, chunks: 1 })).text()) === 'print("de")');
    const big = new Uint8Array(2 * 1024 * 1024 + 5).map((_, i) => i % 251);
    const bid = await T.addFile(new File([big], 'lon.bin'));
    const back = new Uint8Array(await (await S.fileBlob({ id: bid, chunks: 3 })).arrayBuffer());
    ok('File 2MB cắt đoạn rồi ghép lại đúng', back.length === big.length && back[1000000] === big[1000000] && back[back.length - 1] === big[big.length - 1]);
    await T.delFile(id); await T.delFile(bid);
    ok('Xóa file xóa cả nội dung', await until(() => sfiles.length === 0) && (await dbS.get('rooms/lop1/filedata/' + id)) === null && (await dbS.get('rooms/lop1/filedata/' + bid + '/c0')) === null);

    /* thư mục lớp (học sinh chọn lớp) */
    ok('Mở lớp tự đăng ký vào danh sách lớp chung', (await dbT.get('classes/lop1')) && (await dbT.get('classes/lop1')).title === 'Lớp 9A1');
    const cls = await Hub.listClasses(dbS);
    ok('Học sinh liệt kê được các lớp để chọn', cls.length === 1 && cls[0].room === 'lop1' && cls[0].title === 'Lớp 9A1', JSON.stringify(cls));
    await new Hub.TeacherConn(dbT, 'lop2').open({ create: true, title: 'Lớp 8B' });
    const cls2 = await Hub.listClasses(dbS);
    ok('Lớp mới hiện ngay, xếp theo tên (8B trước 9A1)', cls2.map((c) => c.room).join() === 'lop2,lop1', JSON.stringify(cls2));
    await Hub.deleteClass(dbT, 'lop2');
    ok('Xóa lớp gỡ cả dữ liệu lẫn danh sách', (await dbS.get('classes/lop2')) === null && (await dbT.get('rooms/lop2')) === null);

    /* quản trị: tạo tài khoản giáo viên */
    const AD = new Hub.AdminConn(dbT);
    ok('Chưa phải admin khi chưa có admins/<uid>', (await AD.isAdmin()) === false);
    await dbT.set('admins/TEACHER1', true);
    ok('Là admin khi admins/<uid> = true', (await AD.isAdmin()) === true);
    let tl = []; AD.onTeachers((l) => { tl = l; });
    let eShort = null; try { await AD.addTeacher({ email: 'moi@truong.vn', name: 'B', password: '123' }); } catch (e) { eShort = e; }
    ok('Mật khẩu ngắn bị từ chối', eShort && /6 ký tự/.test(eShort.message));
    let eMail = null; try { await AD.addTeacher({ email: 'khong-hop-le', name: 'B', password: '123456' }); } catch (e) { eMail = e; }
    ok('Email sai dạng bị từ chối', eMail && /Email/.test(eMail.message));
    const nu = await AD.addTeacher({ email: 'Moi@Truong.vn', name: 'Nguyễn Văn B', password: 'abc12345' });
    ok('Tạo giáo viên mới: cấp quyền trong teachers', (await dbT.get('teachers/' + nu)) === true, nu);
    ok('Danh sách giáo viên có họ tên, email (chữ thường)', await until(() => tl.length === 1 && tl[0].email === 'moi@truong.vn' && tl[0].name === 'Nguyễn Văn B' && tl[0].by === 'TEACHER1'), JSON.stringify(tl));
    ok('Tạo tài khoản bằng ứng dụng phụ và đăng xuất khỏi ứng dụng phụ', window.__secSignOut >= 1);
    ok('Quản trị viên vẫn đăng nhập (không bị đăng xuất)', dbT.currentUid() === 'TEACHER1');
    const old = await AD.addTeacher({ email: 'cu@truong.vn', name: 'Cũ', password: 'matcu1' });
    ok('Email đã có tài khoản: nhập đúng mật khẩu cũ thì cấp quyền (UID cũ)', old === 'OLDUID' && (await dbT.get('teachers/OLDUID')) === true);
    let eWrong = null; try { await AD.addTeacher({ email: 'cu@truong.vn', name: 'Cũ', password: 'saimatkhau' }); } catch (e) { eWrong = e; }
    ok('Email đã có tài khoản + sai mật khẩu bị từ chối', eWrong && /wrong/.test(eWrong.code || eWrong.message));
    await AD.revoke(nu);
    ok('Thu hồi quyền giáo viên', (await dbT.get('teachers/' + nu)) === null && (await until(() => tl.length === 1)), JSON.stringify(tl));
    AD.close();

    /* mất kết nối (đóng trang) */
    window.dispatchEvent(new Event('pagehide'));
    ok('Đóng trang → học sinh hiện Mất kết nối', await until(() => seen[S.uid].online === false), JSON.stringify(seen[S.uid]));
    await T.removeStudent(S.uid);
    ok('Giáo viên xóa học sinh khỏi lớp', await until(() => !seen[S.uid]));
    S.leave(); T.close();
  } catch (e) { ok('Ngoại lệ không mong đợi', false, e && (e.stack || e.message || e)); }
  window.__checks = checks; window.__done = true;
  document.getElementById('log').textContent = checks.map((c) => (c[1] ? 'PASS ' : 'FAIL ') + c[0] + (c[2] ? '  -> ' + c[2] : '')).join('\n');
})();
</script>
